services:
  postgres:
    image: postgres:16-alpine
    container_name: porware_cai_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: Defina POSTGRES_PASSWORD en su archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-porware_cai}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-porware_cai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cai_internal_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: porware_cai_api_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-porware_cai}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Error: Defina un JWT_SECRET criptografico seguro en su archivo .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-12h}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      INITIAL_ADMIN_CEDULA: ${INITIAL_ADMIN_CEDULA:-V-10000001}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@porware.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Error: Defina INITIAL_ADMIN_PASSWORD en su archivo .env para crear el administrador inicial}
      INITIAL_SECURITY_CEDULA: ${INITIAL_SECURITY_CEDULA:-V-20000002}
      INITIAL_SECURITY_EMAIL: ${INITIAL_SECURITY_EMAIL:-garita@porware.com}
      INITIAL_SECURITY_PASSWORD: ${INITIAL_SECURITY_PASSWORD:-}
    networks:
      - cai_internal_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: porware_cai_web_prod
    restart: always
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - cai_internal_net

volumes:
  postgres_prod_data:

networks:
  cai_internal_net:
    driver: bridge
