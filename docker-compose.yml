version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cai_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cai_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/cai_db?schema=public"
      PORT: 3000
      JWT_SECRET: "cai_jwt_secret_key_porware_migration_2026"
      JWT_EXPIRATION: "24h"
    volumes:
      - ./prisma/data:/usr/src/app/prisma/data

volumes:
  postgres_data:
