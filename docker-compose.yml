version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en su archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-cai_db}
    # Seguridad: Exponer solo a localhost para herramientas de administración local (DBeaver)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cai_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cai_db}?schema=public"
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en su archivo .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
    volumes:
      - ./prisma/data:/usr/src/app/prisma/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
